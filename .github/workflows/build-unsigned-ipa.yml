name: Build SYSY FAMILY V63 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare source
        shell: bash
        run: |
          set -e

          rm -rf Generated
          mkdir -p "Generated/SYSY FAMILY"

          cp "SYSY_FAMILYApp.swift" "Generated/SYSY FAMILY/"
          cp "Models.swift" "Generated/SYSY FAMILY/"
          cp "Theme.swift" "Generated/SYSY FAMILY/"
          cp "MainTabView.swift" "Generated/SYSY FAMILY/"

          if [ -d "Assets.xcassets" ]; then
            cp -R "Assets.xcassets" "Generated/SYSY FAMILY/"
          fi

          sed -i '' '/^```swift[[:space:]]*$/d' "Generated/SYSY FAMILY/Models.swift"
          sed -i '' '/^```[[:space:]]*$/d' "Generated/SYSY FAMILY/Models.swift"

          sed -i '' '/^```swift[[:space:]]*$/d' "Generated/SYSY FAMILY/MainTabView.swift"
          sed -i '' '/^```[[:space:]]*$/d' "Generated/SYSY FAMILY/MainTabView.swift"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("Generated/SYSY FAMILY/MainTabView.swift")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              'description: "\\(item.width, specifier: "%.2f") × \\(item.height, specifier: "%.2f") × \\(item.quantity)",',
              'description: String(format: "%.2f × %.2f × %d", item.width, item.height, item.quantity),'
          )

          text = text.replace(
              'Text("৳ \\(Int(store.data.totalDue))")',
              'Text("৳ \\(Int(store.totalDue))")'
          )

          path.write_text(text, encoding="utf-8")
          PY

          echo "SOURCE CHECK"
          echo "============"

          echo "--- Models.swift first 3 lines ---"
          head -n 3 "Generated/SYSY FAMILY/Models.swift"

          echo "--- Models.swift last 3 lines ---"
          tail -n 3 "Generated/SYSY FAMILY/Models.swift"

          echo "--- MainTabView.swift check ---"
          grep -n "specifier:" "Generated/SYSY FAMILY/MainTabView.swift" || true
          grep -n "store.data.totalDue" "Generated/SYSY FAMILY/MainTabView.swift" || true

      - name: Create Xcode project
        shell: bash
        run: |
          set -e

          cat > "Generated/project.yml" <<'EOF'
          name: SYSY FAMILY

          options:
            projectFormat: xcode16_3
            deploymentTarget:
              iOS: "17.0"
            createIntermediateGroups: true

          settings:
            base:
              SWIFT_VERSION: "5.0"
              IPHONEOS_DEPLOYMENT_TARGET: "17.0"
              SWIFT_STRICT_CONCURRENCY: minimal

          targets:
            SYSY FAMILY:
              type: application
              platform: iOS
              deploymentTarget: "17.0"

              sources:
                - path: "SYSY FAMILY"

              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.sysyfamily.aluminium
                  PRODUCT_NAME: "SYSY FAMILY"
                  SWIFT_VERSION: "5.0"
                  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
                  TARGETED_DEVICE_FAMILY: "1"
                  GENERATE_INFOPLIST_FILE: YES
                  SWIFT_STRICT_CONCURRENCY: minimal

              scheme:
                gatherCoverageData: false
          EOF

          cd Generated
          xcodegen generate

      - name: Build unsigned app
        shell: bash
        run: |
          set -o pipefail

          xcodebuild \
            -project "Generated/SYSY FAMILY.xcodeproj" \
            -scheme "SYSY FAMILY" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "Generated/build/DerivedData" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_VERSION=5.0 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            build 2>&1 | tee build.log

      - name: Show compiler errors
        if: failure()
        shell: bash
        run: |
          echo "======================================"
          echo "COMPILER ERRORS"
          echo "======================================"

          grep -n -E "error:|fatal error:|BUILD FAILED" build.log || true

          echo "======================================"
          echo "LAST 150 LINES"
          echo "======================================"

          tail -n 150 build.log

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SYSY-FAMILY-V63-DIAGNOSTIC
          path: build.log
          if-no-files-found: warn

      - name: Find built app
        if: success()
        shell: bash
        run: |
          set -e

          APP_PATH=$(find \
            "Generated/build/DerivedData/Build/Products" \
            -type d \
            -name "*.app" \
            -path "*Release-iphoneos/*" \
            | head -n 1)

          test -n "$APP_PATH"

          echo "$APP_PATH" > Generated/app_path.txt

      - name: Package IPA
        if: success()
        shell: bash
        run: |
          set -e

          APP_PATH=$(cat Generated/app_path.txt)

          rm -rf Generated/Payload
          mkdir -p Generated/Payload

          cp -R "$APP_PATH" Generated/Payload/

          cd Generated

          zip -r SYSY_FAMILY_V63_unsigned.ipa Payload

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SYSY-FAMILY-V63-IPA
          path: Generated/SYSY_FAMILY_V63_unsigned.ipa
          if-no-files-found: error
