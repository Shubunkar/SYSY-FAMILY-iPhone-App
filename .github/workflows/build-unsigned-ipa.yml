name: Build SYSY FAMILY V63 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Xcode project
        shell: bash
        run: |
          set -e

          rm -rf "SYSY FAMILY.xcodeproj"
          rm -rf "SYSY FAMILY"

          mkdir -p "SYSY FAMILY.xcodeproj"
          mkdir -p "SYSY FAMILY/Assets.xcassets"

          test -f "project.pbxproj"
          test -f "SYSY_FAMILYApp.swift"
          test -f "Models.swift"
          test -f "Theme.swift"
          test -f "MainTabView.swift"

          cp "project.pbxproj" \
            "SYSY FAMILY.xcodeproj/project.pbxproj"

          cp "SYSY_FAMILYApp.swift" "SYSY FAMILY/"
          cp "Models.swift" "SYSY FAMILY/"
          cp "Theme.swift" "SYSY FAMILY/"
          cp "MainTabView.swift" "SYSY FAMILY/"

          cat > "SYSY FAMILY/Assets.xcassets/Contents.json" <<'EOF'
          {
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

      - name: Show Xcode version
        run: |
          xcodebuild -version

      - name: Check project file
        shell: bash
        run: |
          set -e

          test -f "SYSY FAMILY.xcodeproj/project.pbxproj"

          grep -q 'objectVersion = 56;' \
            "SYSY FAMILY.xcodeproj/project.pbxproj"

          grep -q 'compatibilityVersion = "Xcode 15.0";' \
            "SYSY FAMILY.xcodeproj/project.pbxproj"

          echo "Xcode project file check passed."

      - name: Build unsigned app
        shell: bash
        run: |
          set -o pipefail

          xcodebuild \
            -project "SYSY FAMILY.xcodeproj" \
            -scheme "SYSY FAMILY" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Find built app
        shell: bash
        run: |
          set -e

          APP=$(find \
            "build/DerivedData/Build/Products/Release-iphoneos" \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -1)

          test -n "$APP"

          echo "Built app:"
          echo "$APP"

      - name: Package IPA
        shell: bash
        run: |
          set -e

          APP=$(find \
            "build/DerivedData/Build/Products/Release-iphoneos" \
            -maxdepth 1 \
            -name "*.app" \
            -type d \
            | head -1)

          test -n "$APP"

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R "$APP" build/Payload/

          cd build

          zip -qry \
            "SYSY_FAMILY_V63_unsigned.ipa" \
            Payload

          test -f "SYSY_FAMILY_V63_unsigned.ipa"

          ls -lh "SYSY_FAMILY_V63_unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SYSY-FAMILY-V63-IPA
          path: build/SYSY_FAMILY_V63_unsigned.ipa
          if-no-files-found: error
          retention-days: 7
