name: Build SYSY FAMILY V63 IPA

on:
workflow_dispatch:

jobs:
build:
runs-on: macos-15

````
steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Show Xcode version
    run: |
      xcodebuild -version
      swift --version

  - name: Install XcodeGen
    run: brew install xcodegen

  - name: Prepare and fix source
    shell: bash
    run: |
      set -e

      rm -rf Generated
      mkdir -p "Generated/SYSY FAMILY"
      mkdir -p Generated/logs

      echo "Checking source files..."

      test -f "SYSY_FAMILYApp.swift"
      test -f "Models.swift"
      test -f "Theme.swift"
      test -f "MainTabView.swift"

      cp "SYSY_FAMILYApp.swift" "Generated/SYSY FAMILY/"
      cp "Models.swift" "Generated/SYSY FAMILY/"
      cp "Theme.swift" "Generated/SYSY FAMILY/"
      cp "MainTabView.swift" "Generated/SYSY FAMILY/"

      if [ -d "Assets.xcassets" ]; then
        cp -R "Assets.xcassets" "Generated/SYSY FAMILY/"
      fi

      echo "Removing accidental Markdown code fences..."

      sed -i '' '/^```swift[[:space:]]*$/d' "Generated/SYSY FAMILY/Models.swift"
      sed -i '' '/^```[[:space:]]*$/d' "Generated/SYSY FAMILY/Models.swift"

      sed -i '' '/^```swift[[:space:]]*$/d' "Generated/SYSY FAMILY/MainTabView.swift"
      sed -i '' '/^```[[:space:]]*$/d' "Generated/SYSY FAMILY/MainTabView.swift"

      echo "Fixing MainTabView formatting error..."

      python3 - <<'PY'
      from pathlib import Path

      path = Path("Generated/SYSY FAMILY/MainTabView.swift")
      text = path.read_text(encoding="utf-8")

      old = 'description: "\\(item.width, specifier: "%.2f") × \\(item.height, specifier: "%.2f") × \\(item.quantity)",'
      new = 'description: String(format: "%.2f × %.2f × %d", item.width, item.height, item.quantity),'

      if old in text:
          text = text.replace(old, new)
          print("Fixed measurement description.")
      else:
          print("Measurement description pattern not found; continuing.")

      old2 = 'Text("৳ \\(Int(store.data.totalDue))")'
      new2 = 'Text("৳ \\(Int(store.totalDue))")'

      if old2 in text:
          text = text.replace(old2, new2)
          print("Fixed totalDue reference.")
      else:
          print("totalDue pattern not found; continuing.")

      path.write_text(text, encoding="utf-8")
      PY

      echo "Source preparation completed."

      echo "Checking Models.swift first and last lines..."
      head -n 5 "Generated/SYSY FAMILY/Models.swift"
      tail -n 5 "Generated/SYSY FAMILY/Models.swift"

  - name: Create Xcode project
    shell: bash
    run: |
      set -e

      cat > "Generated/project.yml" <<'EOF'
      name: SYSY FAMILY

      options:
        projectFormat: xcode16_3
        deploymentTarget:
          iOS: "17.0"
        createIntermediateGroups: true

      settings:
        base:
          SWIFT_VERSION: "5.0"
          IPHONEOS_DEPLOYMENT_TARGET: "17.0"
          SWIFT_STRICT_CONCURRENCY: minimal

      targets:
        SYSY FAMILY:
          type: application
          platform: iOS
          deploymentTarget: "17.0"

          sources:
            - path: "SYSY FAMILY"

          settings:
            base:
              PRODUCT_BUNDLE_IDENTIFIER: com.sysyfamily.aluminium
              PRODUCT_NAME: "SYSY FAMILY"
              SWIFT_VERSION: "5.0"
              IPHONEOS_DEPLOYMENT_TARGET: "17.0"
              TARGETED_DEVICE_FAMILY: "1"
              GENERATE_INFOPLIST_FILE: YES
              SWIFT_STRICT_CONCURRENCY: minimal

          scheme:
            gatherCoverageData: false
      EOF

      cd Generated
      xcodegen generate

      test -f "SYSY FAMILY.xcodeproj/project.pbxproj"

      echo "Xcode project generated successfully."

  - name: Verify project
    run: |
      set -e

      xcodebuild \
        -project "Generated/SYSY FAMILY.xcodeproj" \
        -scheme "SYSY FAMILY" \
        -showBuildSettings \
        > Generated/logs/build-settings.log

      echo "Project verification completed."

  - name: Build unsigned app
    shell: bash
    run: |
      set -o pipefail

      xcodebuild \
        -project "Generated/SYSY FAMILY.xcodeproj" \
        -scheme "SYSY FAMILY" \
        -sdk iphoneos \
        -configuration Release \
        -derivedDataPath "Generated/build/DerivedData" \
        -destination "generic/platform=iOS" \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO \
        CODE_SIGN_IDENTITY="" \
        SWIFT_VERSION=5.0 \
        SWIFT_STRICT_CONCURRENCY=minimal \
        build \
        2>&1 | tee "Generated/logs/build.log"

  - name: Find built app
    if: success()
    shell: bash
    run: |
      set -e

      APP_PATH=$(find \
        "Generated/build/DerivedData/Build/Products" \
        -type d \
        -name "*.app" \
        -path "*Release-iphoneos/*" \
        | head -n 1)

      if [ -z "$APP_PATH" ]; then
        echo "ERROR: .app file was not found."
        find "Generated/build/DerivedData/Build/Products" -maxdepth 5 -print
        exit 1
      fi

      echo "$APP_PATH" > Generated/app_path.txt

      echo "Built app:"
      cat Generated/app_path.txt

  - name: Package IPA
    if: success()
    shell: bash
    run: |
      set -e

      APP_PATH=$(cat Generated/app_path.txt)

      rm -rf Generated/Payload
      mkdir -p Generated/Payload

      cp -R "$APP_PATH" Generated/Payload/

      cd Generated

      rm -f SYSY_FAMILY_V63_unsigned.ipa

      zip -r SYSY_FAMILY_V63_unsigned.ipa Payload

      test -f SYSY_FAMILY_V63_unsigned.ipa

      echo "IPA created successfully:"
      ls -lh SYSY_FAMILY_V63_unsigned.ipa

  - name: Upload IPA
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: SYSY-FAMILY-V63-IPA
      path: Generated/SYSY_FAMILY_V63_unsigned.ipa
      if-no-files-found: error

  - name: Upload build logs
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: SYSY-FAMILY-V63-BUILD-LOG
      path: Generated/logs/
      if-no-files-found: warn
````
