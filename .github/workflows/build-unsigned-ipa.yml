name: Build SYSY FAMILY V63 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare clean project
        shell: bash
        run: |
          set -e

          rm -rf "Generated"

          mkdir -p "Generated/SYSY FAMILY"

          cp "SYSY_FAMILYApp.swift" "Generated/SYSY FAMILY/"
          cp "Models.swift" "Generated/SYSY FAMILY/"
          cp "Theme.swift" "Generated/SYSY FAMILY/"
          cp "MainTabView.swift" "Generated/SYSY FAMILY/"

          if [ -d "Assets.xcassets" ]; then
            cp -R "Assets.xcassets" "Generated/SYSY FAMILY/"
          fi

          cat > "Generated/project.yml" <<'EOF'
          name: SYSY FAMILY

          options:
            projectFormat: xcode16_3
            deploymentTarget:
              iOS: "17.0"
            createIntermediateGroups: true

          settings:
            base:
              SWIFT_VERSION: "5.0"
              IPHONEOS_DEPLOYMENT_TARGET: "17.0"

          targets:
            SYSY FAMILY:
              type: application
              platform: iOS
              deploymentTarget: "17.0"

              sources:
                - path: "SYSY FAMILY"

              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.sysyfamily.aluminium
                  PRODUCT_NAME: "SYSY FAMILY"
                  SWIFT_VERSION: "5.0"
                  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
                  TARGETED_DEVICE_FAMILY: "1"
                  GENERATE_INFOPLIST_FILE: YES

              scheme:
                gatherCoverageData: false
          EOF

      - name: Generate clean Xcode project
        working-directory: Generated
        run: |
          set -e
          xcodegen generate
          test -f "SYSY FAMILY.xcodeproj/project.pbxproj"

      - name: Verify generated project
        run: |
          set -e
          xcodebuild \
            -project "Generated/SYSY FAMILY.xcodeproj" \
            -scheme "SYSY FAMILY" \
            -showBuildSettings > /tmp/build-settings.txt

      - name: Build unsigned app
        run: |
          set -e

          xcodebuild \
            -project "Generated/SYSY FAMILY.xcodeproj" \
            -scheme "SYSY FAMILY" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "Generated/build/DerivedData" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        shell: bash
        run: |
          set -e

          APP_PATH=$(find "Generated/build/DerivedData/Build/Products" \
            -type d \
            -name "*.app" \
            -path "*Release-iphoneos/*" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app file was not found."
            find "Generated/build/DerivedData/Build/Products" -maxdepth 4 -print
            exit 1
          fi

          echo "Found app:"
          echo "$APP_PATH"

          rm -rf "Generated/Payload"
          mkdir -p "Generated/Payload"

          cp -R "$APP_PATH" "Generated/Payload/"

          cd Generated
          zip -r "SYSY_FAMILY_V63_unsigned.ipa" Payload

          test -f "SYSY_FAMILY_V63_unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SYSY-FAMILY-V63-IPA
          path: Generated/SYSY_FAMILY_V63_unsigned.ipa
          if-no-files-found: error
