      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project "SYSY FAMILY.xcodeproj" \
            -scheme "SYSY FAMILY" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
